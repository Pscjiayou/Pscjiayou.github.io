{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Robot favicon; versioned URLs refresh previously cached theme icons. -->
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico?v=robot-1"/>
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png?v=robot-1"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=robot-1"/>
<link rel="icon" type="image/png" sizes="48x48" href="{{ base_path }}/images/favicon-48x48.png?v=robot-1"/>
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png?v=robot-1"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=robot-1"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=robot-1"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->
